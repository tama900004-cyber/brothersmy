<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BROTHER'S welcome offer</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Arial, Helvetica, sans-serif;
      --red: #c63222;
      --red-dark: #9f2217;
      --white: #ffffff;
      --yellow: #ffe066;
      --focus: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-width: 0;
      margin: 0;
      overflow-x: hidden;
      background: var(--red);
    }

    .offer {
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 7px 16px;
      color: var(--white);
      background: var(--red);
      text-align: center;
    }

    .offer__label,
    .offer__discount,
    .offer__terms {
      margin: 0;
      font-size: 13px;
      line-height: 1.3;
    }

    .offer__label {
      font-weight: 700;
      letter-spacing: 0.06em;
    }

    .offer__discount {
      color: var(--yellow);
      font-weight: 700;
    }

    .offer__coupon {
      min-height: 34px;
      padding: 6px 12px;
      border: 1px dashed rgba(255, 255, 255, 0.85);
      border-radius: 6px;
      color: var(--white);
      background: rgba(11, 13, 15, 0.18);
      font: inherit;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
      cursor: pointer;
    }

    .offer__coupon:hover {
      background: var(--red-dark);
    }

    .offer__coupon:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }

    .offer__coupon:disabled {
      cursor: not-allowed;
      opacity: 0.72;
    }

    .offer__terms {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      opacity: 0.9;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 680px) {
      .offer {
        min-height: 64px;
        flex-wrap: wrap;
        gap: 4px 8px;
        padding: 6px 10px;
      }

      .offer__label,
      .offer__discount,
      .offer__terms {
        font-size: 11px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition: none !important;
        animation: none !important;
      }
    }
  </style>
</head>
<body>
  <aside class="offer" aria-label="Current promotion">
    <p class="offer__label">WELCOME OFFER</p>
    <p class="offer__discount">25% OFF SELECTED ACCESSORIES</p>
    <button class="offer__coupon" id="copyCoupon" type="button" aria-describedby="couponHelp">
      WELCOME25
    </button>
    <span class="sr-only" id="couponHelp">Copy coupon code WELCOME25</span>
    <p class="offer__terms">TERMS APPLY</p>
    <span class="sr-only" id="status" role="status" aria-live="polite"></span>
  </aside>

  <script>
    (() => {
      'use strict';

      const couponCode = 'WELCOME25';
      const couponButton = document.getElementById('copyCoupon');
      const status = document.getElementById('status');

      async function copyCoupon() {
        try {
          await navigator.clipboard.writeText(couponCode);
          status.textContent = 'Coupon code WELCOME25 copied.';
        } catch {
          status.textContent = 'Copy failed. Select and copy WELCOME25 manually.';
        }
      }

      couponButton.addEventListener('click', copyCoupon);
    })();
  </script>
</body>
</html>
